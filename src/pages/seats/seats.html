<ion-header>
  <ion-navbar>
    <ion-title>Asientos</ion-title>
  </ion-navbar>
</ion-header>

<ion-content fullscreen>
  <!-- Skeleton Loader -->
  <div *ngIf="loading" class="skeleton-wrapper">
    <div class="skeleton skeleton-title"></div>
    <div class="skeleton skeleton-subtitle"></div>
    <div class="skeleton skeleton-banner"></div>
    <div class="skeleton-row-1">
      <div class="skeleton skeleton-chip"></div>
      <div class="skeleton skeleton-chip"></div>
    </div>
    <div class="skeleton-row-2">
      <div class="skeleton-column">
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line short"></div>
      </div>
      <div class="skeleton skeleton-button"></div>
    </div>
  </div>
  <div [hidden]="loading">
   <div class="banner">
  <div>
    <h2>Platea A</h2>
    <div class="color-box platea-a"></div>
  </div>
  <div>
    <h2>Platea B</h2>
    <div class="color-box platea-b"></div>
  </div>
  <div>
    <h2>Platea C</h2>
    <div class="color-box platea-c"></div>
  </div>
    <div>
    <h2>Ocupados</h2>
    <div class="color-box occupado"></div>
  </div>
</div>
    <div id="seatWrapper">
      <div #seatContainer>
      </div>
      <div class="zoom-controls">
        <button (click)="zoomOut()">−</button>
        <button (click)="zoomIn()">+</button>
      </div>
      <div id="floatingCart"></div> <!-- Contenedor para el carrito -->
    </div>
  </div>

</ion-content>
